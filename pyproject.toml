[project]
name = "grafting"
dynamic = ["version"]
description = "Validation-driven synthesis of executable environments and tool-use trajectories"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Grafting Authors" }]
keywords = ["ai-agents", "tool-use", "environment-synthesis", "trajectories"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0,<7",
    "loguru>=0.7,<1",
    "hydra-core>=1.3,<2",
    "openai>=2.26.0,<3",
    "anthropic>=0.30.0,<2",
    "rich>=13.0,<14",
]

[project.scripts]
"grafting.env.synthesis" = "grafting.environment.synthesis:main"
"grafting.env.evolve" = "grafting.environment.evolve:main"
"grafting.task.generate" = "grafting.runner.task_generator:main"
"grafting.sim" = "grafting.runner.simulation:main"
"grafting.eval" = "grafting.runner.evaluation:main"
"grafting.export.qwen3" = "grafting.export.qwen3:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/grafting", "src/probe"]

[tool.hatch.build.targets.wheel.force-include]
"src/VERSION" = "grafting/VERSION"
"settings.yaml.example" = "grafting/settings.yaml.example"

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "dist/**",
    ".git/**",
    "*.egg-info/**",
    "outputs/**",
    "results/**",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src/grafting", "src/probe"]
branch = true
